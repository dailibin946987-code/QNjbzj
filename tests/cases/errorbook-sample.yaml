# 回归用例（错题本机器可读形态，示意集）
# 语义源自 LY_JBKF-SH 错题本 E-01~E-13（临终遗言方向 / 承诺台词逻辑 / 道具一致性 /
# 台词替动作 / 轮回剧预言合理性 / 情绪链条 / 轴线 / 钩子 / 结尾钩 等），
# 生产使用时应逐条对齐错题本原文并扩展为全量。
- id: E-01
  title: 临终遗言语义方向错误（语义不应反向）
  error_patterns: [ "遗言里说：\"早知如此，我就不该救他\"", "临死前留下\"后悔救人\"的遗言" ]
  required_patterns: [ "遗言", "情感落点" ]
  note: 审核临终遗言需确保语义方向与人物弧光一致，不出现反向否定。

- id: E-02
  title: 承诺台词逻辑断裂（承诺须有兑现/违背跟踪）
  error_patterns: [ "承诺了却没有任何后续" ]
  required_patterns: [ "承诺" ]
  note: 出现承诺性台词后，剧本后文必须有兑现/违背的剧情落点。

- id: E-03
  title: 道具数量/来源/状态过渡断裂
  error_patterns: [ "凭空出现一把枪", "玉镯突然变回完整" ]
  required_patterns: [ "道具状态" ]
  note: 道具的数量、来源、破损状态须有前文依据与状态过渡。

- id: E-04
  title: 台词替动作说话（情绪须有动作/反应链支撑）
  error_patterns: [ "她愤怒地说：我很生气" ]
  required_patterns: [ "动作描写" ]
  note: 情绪应通过动作/微表情呈现，而非角色直接宣告情绪。

- id: E-05
  title: 台词 100% 覆盖（所有台词必须有说话人承接）
  error_patterns: [ "^[^\\n]*他说：[^\\n]*$" ]
  required_patterns: []
  note: 占位台词未归属到具体人物时视为漏标。

- id: E-06
  title: 分镜轴线违规（180 度轴线方向不可跳切）
  error_patterns: [ "正反打同一镜头跨越轴线" ]
  required_patterns: [ "机位" ]
  note: 连续正反打必须保持在轴线同侧，跳轴需显式过渡镜。

- id: E-07
  title: 结尾留钩（每集/每场结尾必须留钩）
  error_patterns: [ "全剧终" ]
  required_patterns: []
  note: 短剧每集结尾应有钩子；"全剧终"仅允许在真正大结局出现。

- id: E-08
  title: 台词带情绪括号（说话状态须标注）
  error_patterns: [ "^[^\\n]*：\"[^\\n]*\"$" ]
  required_patterns: [ "情绪" ]
  note: 高情绪密度台词应带情绪/动作括号，禁止裸台词冒号引号直接出现。
